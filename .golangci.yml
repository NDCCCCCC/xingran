# golangci-lint 最小配置 (v1.x 语法)
# 目的：抑制 `interface{} → any` 风格提示
#   - 本仓库 264 文件 / ~1261 处 `interface{}` 全部是合法动态值场景
#     (缓存 Set/GetJSON 序列化、JSONata 求值、Excel 动态行映射、reflect helper)
#   - staticcheck SA1029 在本仓库 0 命中
#   - 机械重写无运行期收益，保留现状
# 配合: golangci-lint v1.64+ / staticcheck v0.5+
# 验证: golangci-lint run --timeout=5m ./...

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - staticcheck

issues:
  exclude-rules:
    # SA1029: should use 'any' instead of 'interface{}' —— 风格建议，非 bug
    - linters:
        - staticcheck
      text: "SA1029"
