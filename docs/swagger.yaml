  github_com_xingran-next_xingran-go-backend_internal_services_operations.PhysicalDevicesResult:
    properties:
      devices:
        description: Devices 物理链路设备列表（语义与 GetPhysicalDevices 完全一致，可为空切片，不为 nil）
        items:
          $ref: '#/definitions/github_com_xingran-next_xingran-go-backend_internal_models.WorkstationDevice'
        type: array
      diagnosis:
        allOf:
        - $ref: '#/definitions/github_com_xingran-next_xingran-go-backend_internal_services_operations.PhysicalChainDiagnosis'
        description: |-
          Diagnosis 逐段链路计数，用于区分「数据缺失」与「绑定错位」——
          即使有数据也返回，便于排查「有 1 台但少了几台」。
      emptyMessage:
        description: |-
          EmptyMessage 面向运维人员的中文可读结论（有数据时省略）。
          例："该工位未绑定用户（user_id 为空），物理链路面板按用户维度展示，因此为空。"
        type: string
      emptyReason:
        description: |-
          EmptyReason 空因代码。

          ⚠️ 取值口径（v1.24 Phase 80 修正旧注释的表述矛盾）：
          **「未绑定用户」压过「有数据」** —— 工位未绑 user_id 时，
          即使物理链路能召回设备，EmptyReason 仍为 no_user_bound，
          因为该面板按「用户→物理链路」维度呈现，未绑用户时召回结果无从归属。
          只有「已绑定用户 + 召回到设备」时 EmptyReason 才是空串（JSON 中省略）。
          判定实现见 classifyPhysicalEmptyReason（workstation_device_service.go）。

          取值见 PhysicalEmptyReason* 常量。
        type: string
      total:
        description: Total 设备数量（= len(Devices)），方便前端直接显示「N 台」
        type: integer
      warnings:
        description: |-
          Warnings 非致命告警（**任何情况下都可能有**，包括有数据时）。

          典型场景（3f130）：物理链路能召回设备，但工位未绑定 user_id —— 此时
          emptyReason 已是 no_user_bound（同上，根因可见），Warnings 仍单独承载该告警，
          两个通道语义互补：emptyReason 给「结论」，warnings 给「逐条提示」。
        items:
          type: string
        type: array
    type: object
