<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Content Security Policy (CSP) -->
    <!-- 开发环境：宽松策略，支持 Vite HMR 和本地网络访问 -->
    <!-- 注意: 暂时禁用 CSP 以便调试 -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.baidu.com http://*.baidu.com https://*.bdimg.com http://*.bdimg.com; style-src 'self' 'unsafe-inline' https://*.baidu.com https://*.bdimg.com; img-src 'self' data: blob: http://10.62.10.33:* https://* http://*; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* http://10.62.10.33:* https: ws://localhost:* ws://127.0.0.1:* ws://10.62.10.33:* blob:; worker-src 'self' blob:;" /> -->

    <!-- 其他安全相关 Meta 标签 -->
    <!-- 注意: X-Frame-Options 需要通过 HTTP 头设置，meta 标签无效 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>xingran-react-frontend</title>
  </head>
  <body>
    <!-- F-01: inline skeleton — renders immediately while encryption config loads in background.
         #root content is replaced by React once hydrated. -->
    <div id="root">
      <style>
        #root-loading {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #f0f2f5;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          color: #374151;
        }
        #root-loading .logo {
          width: 40px;
          height: 40px;
          border-radius: 8px;
          background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
          margin-bottom: 16px;
          animation: pulse 1.5s ease-in-out infinite;
        }
        #root-loading .title {
          font-size: 18px;
          font-weight: 600;
          margin-bottom: 24px;
          letter-spacing: 0.5px;
        }
        #root-loading .spinner {
          width: 28px;
          height: 28px;
          border: 3px solid #e5e7eb;
          border-top-color: #1677ff;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
      </style>
      <div id="root-loading">
        <div class="logo"></div>
        <div class="title">信软运维管理平台</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
