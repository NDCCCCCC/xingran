# XingRan nginx 站点配置示例（后端 embed 二进制 + 根路径部署）
#
# 安装:
#   cp deploy/xingran.nginx.conf /etc/nginx/conf.d/xingran.conf
#   nginx -t && systemctl reload nginx
#
# 语义:
#   前端以根路径 base 构建（dist 资源引用形如 /assets/xxx.js，无子路径前缀），
#   nginx 直接把 / 下的全部请求转发给后端 :9000，不剥任何前缀。
#   后端 embed 静态服务直接命中根路径资源；API 在 /api/v1/...。
#
# 历史注记（2026-10-20）:
#   旧形态为 /xingran 子路径部署（VITE_BASE=/xingran + nginx 剥前缀
#   proxy_pass http://127.0.0.1:9000/）。该形态派生了多起前缀类问题
#   （API 404 / Router basename 白屏 / WS 相对路径非法），已统一废弃 ——
#   后端对旧的 /xingran 请求仍保留剥离兜底（internal/server/subpath.go），
#   但新部署一律用根路径形态。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream xingran_backend {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://xingran_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 透传（通知公告 /api/v1/system/ws/...）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
