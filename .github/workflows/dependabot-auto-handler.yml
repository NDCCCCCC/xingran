# Dependabot auto-handler — auto-label + selective patch auto-merge for bot PRs.
#
# Why this exists:
#   - dependabot.yml groups dev/prod npm bumps into single PRs (good) but never
#     merges them; the project had no bot-handler before this, so:
#       (a) CI fails quietly and PRs rot
#       (b) every dependabot PR comments back about missing labels
#   - This workflow fixes (a) by queuing auto-merge for safe (patch + green CI)
#     Dependabot PRs and posting a diagnostic on CI failure.
#   - We rely on dependabot/fetch-metadata to classify the bump type — this
#     avoids re-implementing semver parsing in shell.
#
# Auto-merge policy (per spec):
#   - semver-patch  → enable auto-merge (squash, CI must be green via branch
#                     protection "require status checks" — typically ci.yml)
#   - semver-minor  → leave for human review (comment explains why)
#   - semver-major  → leave for human review (comment explains why)
#     rationale: this codebase's recent dep bumps include major-version jumps
#     (vite 7→8, typescript 5→7, eslint 9→10) that have broken peer deps and
#     type variance on day one; auto-merging majors has been a net negative.
#
# Label policy:
#   - Always: "dependencies"
#   - /xingran-react-frontend → "frontend"
#   - .github/workflows/**    → "ci"
#   - Set early (before CI runs) so dependabot stops warning about missing
#     labels in its own comment thread.
#
# Permissions:
#   - contents: write     → merge commits
#   - pull-requests: write → comment + label
#   - checks: read        → inspect CI status
#   No id-token or deploy secrets — never touches production.
#
# Notes for reviewers:
#   - The job runs only when `github.actor == 'dependabot[bot]'`. This makes
#     the workflow a no-op for human PRs and prevents re-entry on re-runs.
#   - Branch protection on main is expected to require ci.yml success and to
#     allow auto-merge via squash. Without that, enabling auto-merge is a
#     no-op; the comment step still runs to flag CI failure.
#   - Cancel-in-progress is false on purpose: serialize label-then-merge
#     within the same PR to avoid races.

name: dependabot-auto-handler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  handle:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch dependabot metadata (semver type + ecosystem)
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply repo labels
        uses: actions/github-script@v9
        with:
          script: |
            // Always add "dependencies"; add "frontend" for npm-PRs touching
            // xingran-react-frontend, "ci" for PRs touching workflow files.
            const labels = ['dependencies'];
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.issue.number, per_page: 100 }
            );
            const paths = files.map(f => f.filename);
            if (paths.some(p => p.startsWith('xingran-react-frontend/'))) labels.push('frontend');
            if (paths.some(p => p.startsWith('.github/workflows/'))) labels.push('ci');
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels,
            });

      - name: Comment + skip auto-merge for non-patch bumps
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-patch' }}
        uses: actions/github-script@v9
        with:
          script: |
            const kind = `${{ steps.meta.outputs.update-type }}`;
            const tag = kind === 'version-update:semver-major' ? '⚠️ Major' : '🟡 Minor';
            const body = [
              `${tag} bump — auto-merge **not** enabled.`,
              '',
              'Per `dependabot-auto-handler` policy, only `semver-patch` Dependabot PRs auto-merge once CI is green.',
              'Major and minor bumps touch APIs and require human review.',
              '',
              '_Posted by `dependabot-auto-handler` workflow_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

      - name: Enable auto-merge for patch bumps (CI will gate the actual merge)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

      - name: Comment diagnostic on CI failure (patch + green-required path)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' }}
        uses: actions/github-script@v9
        with:
          script: |
            // Wait briefly so the check status is settled on synchronize events.
            await new Promise(r => setTimeout(r, 20000));
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha, per_page: 50,
            });
            const failed = checks.data.check_runs.filter(c => c.conclusion === 'failure');
            if (failed.length === 0) return;
            const runUrl = failed[0].details_url?.replace(/\/job\/.*$/, '');
            const body = [
              '⚠️ CI failed — auto-merge will queue once CI is green again.',
              '',
              '| Job | Conclusion |',
              '| --- | --- |',
              ...failed.map(c => `| \`${c.name}\` | ❌ ${c.conclusion} |`),
              '',
              runUrl ? `🔗 [Inspect run](${runUrl})` : '',
              '',
              '_Posted by `dependabot-auto-handler` workflow_',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
