# CI quality gate — PR / push to main.
#
# Two independent jobs (backend slow, frontend fast → parallel feedback):
#   backend:  golangci-lint + go test (packages that need no live services)
#   frontend: lint → type-check → vitest → build (cheap-to-expensive order)
#
# Deploy lives in deploy.yml (separate file on purpose):
#   - this file carries NO secrets context and only `contents: read`
#   - concurrency semantics are opposite (CI cancels stale runs; deploys queue)

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod declares go 1.24.0 + toolchain go1.24.5; GOTOOLCHAIN=auto
          # (setup-go default) fetches the exact toolchain if needed.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Bumped from v1.64.8 → v2.12.2 alongside dependabot PR #1's
          # action bump v6 → v9 (action v7+ requires lint v2+).
          # .golangci.yml also migrated to v2 schema in the same commit.
          version: v2.12.2
          args: --timeout=5m ./...

      - name: Test
        # Explicit package list excludes the root tests/ dir (integration
        # tests that need a running service) and rpa-worker/ (separate Go
        # module). Most unit tests use glebarez sqlite (:memory:, pure Go).
        # If a package starts timing out, fall back to a whitelist:
        #   go test ./internal/config/... ./pkg/...
        # and re-admit packages one by one.
        run: go test -timeout 15m -count=1 ./internal/... ./pkg/... ./cmd/...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: xingran-react-frontend

    steps:
      # Full-repo checkout (not sparse): npm prebuild (sync-columns-schema)
      # writes back to internal/services/system/*.json
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pin to current LTS. Never use 'latest' — non-reproducible CI
          # is a CI smell. Bump in a deliberate commit when EOL approaches.
          node-version: '24'
          # Cache ~/.npm keyed on the lockfile. Do NOT cache node_modules
          # directly — architecture-dependent, not safely cacheable.
          cache: npm
          cache-dependency-path: xingran-react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        # 2026-08-20: 恢复 strict gate。此前 dependabot PR #3 因误删
        # typescript-eslint parser 配置导致 627 个解析错误，被迫
        # continue-on-error。现 parser 已恢复（实际版本 TS 5.9.3 +
        # eslint 9.39.2，从未升到 TS 7 / eslint 10），lint 可正常通过，
        # 移除 continue-on-error 让 lint 重新成为硬门禁。
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        # vitest auto-runs once (no watch) when CI=true
        run: npm run test

      - name: Build
        run: npm run build
