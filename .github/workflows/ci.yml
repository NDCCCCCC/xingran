# CI quality gate — PR / push to main.
#
# Two independent jobs (backend slow, frontend fast → parallel feedback):
#   backend:  golangci-lint + go test (packages that need no live services)
#   frontend: lint → type-check → test:coverage → coverage gate → build
#             (cheap-to-expensive order; coverage gate = Phase 82 全量口径 gate)
#
# Deploy lives in deploy.yml (separate file on purpose):
#   - this file carries NO secrets context and only `contents: read`
#   - concurrency semantics are opposite (CI cancels stale runs; deploys queue)

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod declares go 1.24.0 + toolchain go1.24.5; GOTOOLCHAIN=auto
          # (setup-go default) fetches the exact toolchain if needed.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Bumped from v1.64.8 → v2.12.2 alongside dependabot PR #1's
          # action bump v6 → v9 (action v7+ requires lint v2+).
          # .golangci.yml also migrated to v2 schema in the same commit.
          version: v2.12.2
          args: --timeout=5m ./...

      - name: Test
        # Explicit package list excludes the root tests/ dir (integration
        # tests that need a running service) and rpa-worker/ (separate Go
        # module). Most unit tests use glebarez sqlite (:memory:, pure Go).
        # If a package starts timing out, fall back to a whitelist:
        #   go test ./internal/config/... ./pkg/...
        # and re-admit packages one by one.
        # Phase 71 GOV-01: -coverprofile + -covermode=atomic (count=1 already
        # present). atomic mode is Go 1.21+ standalone (no -race needed; -race
        # would 5-10x coverage time, forbidden by D-01 Claude's Discretion).
        run: |
          go test -timeout 15m -count=1 -coverprofile=coverage.out -covermode=atomic \
            ./internal/... ./pkg/... ./cmd/...

      - name: Test xingran-cli (submodule)
        # xingran-cli 是独立 go.mod 子模块，上面的 ./internal/... 扫不到它。
        # 它的 coverage 单独产出（cli-coverage.out），供 coverage-diff job 合并：
        # 不能直接并入 coverage.out，因为 CLI 含大量零覆盖的生成代码
        # （cmd/*_cmds.go），会拉低本 job 的加权总覆盖率门禁。
        run: |
          cd xingran-cli
          go test -timeout 10m -count=1 -coverprofile=cli-coverage.out -covermode=atomic ./...
          mv cli-coverage.out ..

      - name: Coverage HTML report
        # GOV-01: human-readable HTML for browser inspection on the artifact
        # page. if: always() so a gate failure later does not block this step
        # (we still want the HTML when the gate has to fail visibly).
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Coverage gate
        # GOV-02: weighted-average floor read from .coverage-threshold (D-01).
        # Script exits 0/1; exit 1 fails this step and the workflow. Script
        # itself returns 0 when coverage.out is missing (soft skip) so the
        # if: always() Upload step below can still publish the HTML for debug.
        run: bash .github/scripts/check-coverage.sh coverage.out .coverage-threshold

      - name: Upload coverage artifact
        # GOV-01 + D-02: actions/upload-artifact@v4 (NOT @v7) with 30-day
        # retention. Both raw coverage.out and HTML uploaded for local debug
        # when the gate fails. if: always() so a gate failure still publishes
        # the artifact instead of leaving the developer blind to the regression.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.out
            coverage.html
            cli-coverage.out
          retention-days: 30

  coverage-diff:
    # GOV-03 (Phase 74, D-14): PR diff coverage ≥80% gate. PR-only — push to
    # main has no diff base and is already gated by the backend job's
    # weighted-average floor. D-14 locked an external action with an explicit
    # ratchet to self-implementation; the locked actions (gocover-coverage /
    # ory/xcoverage-action) could not be verified to exist, so the gate is
    # implemented in-repo (.github/scripts/check-diff-coverage.sh) with the
    # same zero-dep bash+awk paradigm as check-coverage.sh (D-01).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base (three-dot) diff needs full history
          fetch-depth: 0

      - name: Download coverage profile
        # Reuses the backend job's coverage.out — no second test run.
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage

      - name: Merge xingran-cli coverage
        # CLI 是独立 go.mod 子模块，其覆盖记录不在 coverage.out 里。
        # 不合并的话，CLI 的改动行会被 diff gate 判为「未覆盖」（GOV-03 误伤）。
        # 合并后路径天然可被脚本的 MODULE 前缀剥离：
        #   <root module>/xingran-cli/internal/... → xingran-cli/internal/...
        run: |
          if [ -f cli-coverage.out ]; then
            grep -v '^mode:' cli-coverage.out >> coverage.out
            echo "merged $(wc -l < cli-coverage.out) CLI coverage lines"
          else
            echo "cli-coverage.out absent — skipping merge"
          fi

      - name: Diff coverage gate (≥80%)
        # Exit 1 when <80% of changed executable .go lines are covered.
        # Exits 0 (skip) when the PR touches no testable .go lines.
        run: bash .github/scripts/check-diff-coverage.sh coverage.out origin/${{ github.base_ref }} 80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: xingran-react-frontend

    steps:
      # Full-repo checkout (not sparse): npm prebuild (sync-columns-schema)
      # writes back to internal/services/system/*.json
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pin to current LTS. Never use 'latest' — non-reproducible CI
          # is a CI smell. Bump in a deliberate commit when EOL approaches.
          node-version: '24'
          # Cache ~/.npm keyed on the lockfile. Do NOT cache node_modules
          # directly — architecture-dependent, not safely cacheable.
          cache: npm
          cache-dependency-path: xingran-react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Peer dependency compat check
        # Pre-flight check: catch peer-incompatible version combinations BEFORE
        # the slow lint/typecheck/test/build pipeline runs.
        # Background: dependabot PR #26 bumped typescript 5.9.3 → 7.0.2 alongside
        # typescript-eslint 8.50.0 → 8.70.0 (incompatible — peer is
        # 'typescript': '>=4.8.4 <6.1.0'). Lint failed with a confusing
        # 'typescript-eslint does not support TS 7.0' message 8 minutes into the
        # pipeline. This step surfaces peer violations in ~10s as plain text,
        # saving CI minutes and giving an actionable error.
        # Note: `npm ls --all` has known false-positives (e.g. react@19.3.0 itself
        # reports invalid against its own peer after major release). We log
        # violations as warnings so maintainers can spot real regressions
        # without blocking CI on npm-tooling noise. Promote to ::error:: + exit 1
        # if a future regression is real and unambiguous.
        run: |
          set -e
          # Capture stderr (where npm prints the per-violation inv lists) and
          # stdout (JSON tree) — they normally intermix on conflict. Parse stderr
          # line-by-line for `npm error invalid: ...` rows.
          npm ls --all --json > /tmp/npm-ls.json 2> /tmp/npm-ls-stderr.txt || true
          invalid_count=$(grep -c '^npm error invalid:' /tmp/npm-ls-stderr.txt || true)
          if [ "$invalid_count" -gt 0 ]; then
            echo "::warning::Found $invalid_count peer-dependency entries flagged by npm ls — review below"
            grep '^npm error invalid:' /tmp/npm-ls-stderr.txt | head -20
            if [ "$invalid_count" -gt 20 ]; then
              echo "  ... and $(($invalid_count - 20)) more (truncated; see job log)"
            fi
            echo "::notice::If violations look like real peer breaks (e.g. typescript-eslint 8.x against typescript 7), consider closing PR + extending dependabot.yml ignore."
          else
            echo "Peer dependencies: OK"
          fi

      - name: Format check
        # prettier --check 是廉价 fail-fast:文本比对不需要 transform/parse。
        # 在 lint/type-check/test/build 之前跑,任何未格式化文件立刻阻断 CI,
        # 与本地 lint-staged 的 prettier --write 互补(pre-commit 自动修;
        # CI 兜底确保 push 进来的代码至少已经通过 check,不会被 --write 改写)。
        run: npm run format:check

      - name: Lint
        # 2026-08-20: 恢复 strict gate。此前 dependabot PR #3 因误删
        # typescript-eslint parser 配置导致 627 个解析错误，被迫
        # continue-on-error。现 parser 已恢复（实际版本 TS 5.9.3 +
        # eslint 9.39.2，从未升到 TS 7 / eslint 10），lint 可正常通过，
        # 移除 continue-on-error 让 lint 重新成为硬门禁。
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  frontend-coverage:
    # 前端覆盖率测试独立成 job 并分片并行（2026-11-03 C-3 CI 提速）。
    #
    # 为什么分片：ubuntu-latest 是 4 核，vitest maxWorkers 已被 4 占满 ⇒ 单机
    # 无法再并行。实测单 job 全量 4059 个测试墙钟约 15.5 分钟（Duration 927s，
    # 其中 import 868s / tests 2037s 均为 4 worker 累加），逼近本仓 frontend
    # job 的 timeout-minutes: 25 ⇒ 再慢一点就会超时挂 CI。
    # 拆成 4 个 shard 并行后，墙钟降到约 1/4，门禁语义不变。
    #
    # 分片安全性：vitest --shard 按测试文件分配，同一文件内的用例不拆分 ⇒
    # 用例间共享状态的行为不变。coverage 合并由 vitest merge-reports 完成
    # （官方支持），合并后才是全量口径，喂给既有门禁脚本。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: xingran-react-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: xingran-react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test (coverage, shard ${{ matrix.shard }}/4)
        # 每片输出到独立子目录：merge-reports 以 reportsDirectory 为输入根，
        # 扫其下的子目录收集各片 coverage-final.json。
        run: npm run test:coverage -- --shard=${{ matrix.shard }}/4 --coverage.reportsDirectory=coverage/shards/shard-${{ matrix.shard }}

      - name: Upload shard coverage
        # 上传**单片目录**（而非整个 shards 目录）：upload v4 以路径的最小公共祖先
        # 为 artifact 根 ⇒ artifact 内就是 coverage-final.json（路径前缀被剥离）
        # ⇒ 下载到 coverage/shards/ 后结构为 shards/<artifact 名>/coverage-final.json，
        # 深度固定 ⇒ merge-reports 在一层下即可全部找到（实测：上传整个 shards/
        #   会多出一层 shard-N/，下载后变成两层，合并脚本找不到文件）。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}
          path: xingran-react-frontend/coverage/shards/shard-${{ matrix.shard }}/
          retention-days: 30

  frontend-coverage-merge:
    # 合并 4 个 shard 的 coverage 并跑全局门禁（原 frontend job 内的
    # Test + Coverage gate + Upload 三步整体搬到这里）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-coverage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: xingran-react-frontend/package-lock.json

      - name: Install dependencies
        # ⚠️ 必须：merge 步骤调 `npx vitest merge-reports`，vitest 是 devDependency
        # ⇒ 没有 node_modules 时 npx 找不到 vitest（实测命令 0.3s 即失败且无报错输出）。
        run: npm ci --legacy-peer-deps
        working-directory: xingran-react-frontend

      - name: Download all shards
        # 每片的 artifact 内是 coverage-final.json（上传时以单片目录为根 ⇒
        # 前缀被剥离）⇒ 下载后结构为 shards/<artifact 名>/coverage-final.json。
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-coverage-shard-*
          path: xingran-react-frontend/coverage/shards

      - name: Merge coverage reports
        # ⚠️ 不用 `vitest merge-reports`：该子命令在 vitest 4 下的参数与文档/直觉
        #   不一致（实测 `--reportsDirectory` 报 "Unknown option"，连续两轮 CI 因此失败）。
        # ⇒ 改用官方 istanbul-lib-coverage（@vitest/coverage-v8 的依赖，随 npm ci 安装）
        #   做合并：istanbul 格式的标准合并路径，无手写合并逻辑、无 key 冲突风险。
        # 脚本会打印对照数据（去重后文件数 / statements 总数）⇒ 这是
        # 「分片后覆盖率分母不得变小」这条正确性闸的数据来源。
        # 找不到任何分片 ⇒ 脚本以非 0 退出 ⇒ fail-closed，不静默产出半个覆盖率。
        working-directory: xingran-react-frontend
        run: node ../scripts/devtools/merge-coverage.cjs coverage/shards coverage/coverage-final.json

      - name: Coverage gate
        # GOV-03/GOV-05 (82-04): 全局阈值 + per-dir floor + 白名单漂移三合一,
        # exit 1/4/6 任一即本 job 红。本 gate (check-frontend-coverage.sh) 在
        # json 缺失时软跳过 (exit 0), 对称 backend check-coverage.sh 语义——
        # 不挂 if: always()。注意: 这与本仓另一只 diff gate 脚本
        # (check-frontend-diff-coverage.sh) 的 fail-closed exit 2 (WR-01) 刻意
        # 不对称——那只脚本 pairing 的是 if: always() Upload 已完成的 diff job,
        # json 缺失属配置漂移必须显式红; 两者不可混读。
        # working-directory: . 覆盖 job 级 xingran-react-frontend (Pitfall 4):
        # 否则 .github/scripts 与 .coverage-fe-floors 相对 frontend 目录解析不到。
        working-directory: .
        run: bash .github/scripts/check-frontend-coverage.sh xingran-react-frontend/coverage/coverage-final.json .coverage-fe-floors

      - name: Upload merged coverage artifact
        # D-03 (82-04): 合并后的 vitest json 随 artifact 上传供 PR diff job 复用
        # 与本地 debug 下载。if: always()：gate 失败仍发布 artifact。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: xingran-react-frontend/coverage/coverage-final.json
          retention-days: 30

  frontend-coverage-diff:
    # GOV-04 (82-04, D-02): PR-only 前端 diff coverage ≥80% gate, 逐字段对称
    # 后端 coverage-diff job。复用 frontend job 上传的 vitest json artifact
    # (零重复测试); push 无 diff base (已被 frontend job 的全局阈值 gate 把守),
    # 故仅 PR 触发。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-coverage-merge
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base (three-dot) diff needs full history
          fetch-depth: 0

      - name: Download coverage report
        # Reuses the merged coverage-final.json from frontend-coverage-merge —
        # no second test run.
        # 与后端 coverage-diff 的唯一刻意偏差: download 带 path 输入。upload v4
        # 上传目录时以路径最小公共祖先为 artifact 根 (xingran-react-frontend/
        # 前缀被剥离, json 与 html 报告位于 artifact 根); 无 path 输入时 json
        # 解压到 workspace 根而非脚本第一参数路径, gate 会在所有 PR 上命中
        # 脚本的 profile 缺失分支——该分支自 WR-01 (27f275e) 起为 fail-closed
        # exit 2: job 显式红并提示 configuration drift, 不再静默放行。path
        # 输入因此是让 gate 真正读到 json 跑起来, 而非防静默失效 (防失效已由
        # fail-closed 兜底)。后端上传的是 workspace 根单文件, 故其 download
        # 无需 path。
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: xingran-react-frontend/coverage

      - name: Diff coverage gate (≥80%)
        # Exit 1 when <80% of changed executable .ts/.tsx lines are covered.
        # Exits 0 (skip) only when the PR touches no testable lines.
        # json 缺失 = fail-closed exit 2 (WR-01, 27f275e): 本 job 挂 needs:
        # frontend, 到这里 json 必然存在, 缺失即配置漂移, 显式红不软跳过。
        # 本 job 无 defaults.working-directory, 从 workspace root 跑; artifact
        # 内容已经 path 输入解压回 xingran-react-frontend/coverage/ 下。
        run: bash .github/scripts/check-frontend-diff-coverage.sh xingran-react-frontend/coverage/coverage-final.json origin/${{ github.base_ref }} 80
