# 开发环境配置
server:
  name: "RuoYi-Next-Dev"
  host: "0.0.0.0"
  port: 9000
  mode: "debug"

database:
  host: "postgres"
  port: 5432
  user: "ruoyi"
  password: "ruoyi123"
  dbname: "ruoyi_next"
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  max_lifetime: 1800

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  pool_size: 5

jwt:
  secret_key: "ruoyi-next-dev-secret-key"
  access_key_expire: 3600
  refresh_key_expire: 86400
  issuer: "RuoYi-Next-Dev"

log:
  level: "debug"       # 日志级别: debug, info, warn, error
  log_dir: "logs"      # 日志目录
  max_size: 100        # 单个日志文件最大大小(MB)
  max_backups: 30      # 保留的旧日志文件最大数量
  max_age: 90          # 保留旧日志文件的最大天数
  compress: true       # 是否压缩旧日志文件

# 安全配置
security:
  # 开发环境放宽时间戳容差到 120s,便于手动调试、模拟慢客户端
  replay_window_sec: 120