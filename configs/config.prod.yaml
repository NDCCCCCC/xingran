# 生产环境配置
server:
  name: "RuoYi-Next"
  host: "0.0.0.0"
  port: 8080
  mode: "release"

database:
  host: "postgres"
  port: 5432
  user: "ruoyi"
  password: "ruoyi123"
  dbname: "ruoyi_next"
  sslmode: "require"
  max_open_conns: 100
  max_idle_conns: 10
  max_lifetime: 3600

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret_key: "PLEASE_CHANGE_THIS_IN_PRODUCTION_ENVIRONMENT"
  access_key_expire: 7200
  refresh_key_expire: 604800
  issuer: "RuoYi-Next"

log:
  level: "info"        # 日志级别: debug, info, warn, error
  log_dir: "logs"      # 日志目录
  max_size: 100        # 单个日志文件最大大小(MB)
  max_backups: 30      # 保留的旧日志文件最大数量
  max_age: 90          # 保留旧日志文件的最大天数
  compress: true       # 是否压缩旧日志文件

# 代码生成器配置（生产环境已禁用）
generator:
  enabled: false
  output_mode: "preview"
  project_root: "."
  backend:
    staging_dir: ".generated/backend"
    output_dir: ""
    model_dir: "internal/models"
    handler_dir: "internal/api/v1"
    router_dir: "internal/api/v1"
  frontend:
    staging_dir: ".generated/frontend"
    output_dir: "ruoyi-react-frontend/src"
    types_dir: "types"
    pages_dir: "pages/system"
    api_dir: "api"
  security:
    disable_in_production: true