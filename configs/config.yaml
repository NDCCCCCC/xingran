# 服务器配置
server:
  name: "RuoYi-Next"
  host: "0.0.0.0"
  port: 9000
  mode: "debug"  # debug, release, test

# 数据库配置 - PostgreSQL
# 环境变量: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
database:
  host: "10.62.10.34"
  port: 5432
  user: "postgres"
  password: "Cpic1234"
  dbname: "ruoyi"
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  max_lifetime: 1800  # 连接最大生命周期（秒）

# 缓存配置 - 开发环境
# 环境变量: REDIS_URL, REDIS_PASSWORD
cache:
  type: "redis"  # redis, memory
  host: "10.62.10.34"
  port: 6379
  password: ")(PO09po"
  db: 0
  pool_size: 10
  max_size: 1000
  cleanup_time: 600  # 清理间隔（秒）
  warm_up_enabled: true  # 是否启用缓存预热（默认禁用）
  # L2缓存写入Worker Pool配置
  l2_writer:
    worker_count: 5       # L2写入工作goroutine数量
    queue_size: 5000      # L2写入任务队列大小
    enqueue_timeout: 1s   # 入队超时时间
    write_timeout: 5s     # L2写入超时时间
    fallback_write_timeout: 3s  # 入队失败时同步降级超时（保证数据一致性）
  # L2缓存写入重试配置
  retry_enabled: true  # 是否启用L2缓存写入重试（默认启用）
  retry_max_retries: 3  # 最大重试次数
  retry_initial_delay: 50  # 初始延迟（毫秒）
  retry_max_delay: 2000  # 最大延迟（毫秒）
  retry_backoff_factor: 2.0  # 退避因子
  retry_worker_count: 3  # 重试工作协程数

# JWT配置
jwt:
  secret_key: "ruoyi-next-secret-key-please-change-in-production"
  access_key_expire: 7200   # 访问令牌过期时间（秒）
  refresh_key_expire: 604800  # 刷新令牌过期时间（秒）
  issuer: "RuoYi-Next"
  use_sm2: true  # 是否使用SM2国密算法
  # SM2密钥对（固定密钥，请妥善保管私钥，不要提交到公开仓库）
  sm2_private_key: "d8d9a3e6b356cf7538cb0fd6a486055c2a621a63a8a095e60a6362874b26508b"
  sm2_public_key: "04519c8e8a00307a10034816429fe80a50dc1d0437e84aa3f3215e69280e582f650b49b989eef6acd592fc72b3af4b984f3acac78a0a3f563e430230abb0801f3b"

# 日志配置
log:
  level: "info"        # 日志级别: debug, info, warn, error
  log_dir: "logs"      # 日志目录
  max_size: 100        # 单个日志文件最大大小(MB)
  max_backups: 30      # 保留的旧日志文件最大数量
  max_age: 90          # 保留旧日志文件的最大天数
  compress: true       # 是否压缩旧日志文件

# 安全配置
security:
  # SM4 加密密钥（16字节，Base64编码）
  # 默认值: dGVzdC1zZWNyZXQxNiEhIQ== 解码后为 "test-secret16!!!" (16字节)
  # 生产环境请使用: export SM4_KEY="$(openssl rand -base64 16)"
  sm4_key: "dGVzdC1zZWNyZXQxNiEhIQ=="
  # 请求体加密配置
  request_encryption:
    enabled: true  # 是否启用请求体加密
    # 排除的路径（支持通配符）
    exclude_paths:
      - "/api/v1/system/auth/public-key"  # 公钥接口必须排除
      - "/api/v1/system/auth/test-sm2"   # SM2 测试接口
      # 登录接口已移除 - 启用请求体加密 (Phase 18)
      - "/api/v1/upload/*"                # 文件上传
      - "/api/v1/captcha/*"               # 验证码
      - "/api/v1/rpa/workers/register"   # RPA Worker 注册
      - "/api/v1/rpa/workers/*/heartbeat"  # RPA Worker 心跳
      - "/api/v1/rpa/workers/progress"  # RPA Worker 进度上报
    require_encryption: false  # 是否强制要求加密（渐进式启用：先设为 false，验证后设为 true）
  # 响应加密配置
  response_encryption:
    enabled: false  # 是否启用响应加密（默认禁用，向后兼容）
    # 排除的路径（支持通配符，与请求加密共享排除列表）
    exclude_paths:
      - "/api/v1/system/auth/public-key"  # 公钥接口必须排除
      - "/api/v1/system/auth/test-sm2"   # SM2 测试接口
      # 登录接口已移除 - 启用响应体加密 (Phase 18)
      - "/api/v1/upload/*"                # 文件上传
      - "/api/v1/captcha/*"               # 验证码
      - "/api/v1/rpa/workers/register"   # RPA Worker 注册
      - "/api/v1/rpa/workers/*/heartbeat"  # RPA Worker 心跳
      - "/api/v1/rpa/workers/progress"  # RPA Worker 进度上报
    # 注意：响应加密与请求加密使用相同的数据库配置键 (sys.request.encryption.enabled)
    # 中间件会从数据库动态读取配置，此处的 enabled 仅用于初始化检查
    # 实际开关由参数管理中的 "sys.request.encryption.enabled" 控制

# 百度地图配置
# 环境变量: BAIDU_MAP_AK
baidu:
  map_ak: "31jIJbkkaQHV6pNXbrQmnOoSrynzalC8"

# RPA 配置
rpa:
  enabled: true

  # AI 配置（混合模式）
  ai:
    # 脚本生成模型（文本模型）
    generator:
      enabled: true
      api_key: ""  # 通过环境变量 RPA_AI_GENERATOR_KEY 配置
      base_url: "" # 通过环境变量 RPA_AI_GENERATOR_URL 配置，OpenAI 兼容 API
      model: "gpt-4o-mini" # 推荐: 快速便宜
      max_tokens: 4000

    # AI Agent 模型（视觉模型，必需）
    agent:
      enabled: true
      api_key: "" # 通过环境变量 RPA_AI_AGENT_KEY 配置
      base_url: "" # 通过环境变量 RPA_AI_AGENT_URL 配置，支持 Vision 的模型
      model: "gpt-4o" # 推荐: gpt-4o, claude-3-5-sonnet-20241022
      max_tokens: 8000
      # 备选模型: claude-3-5-sonnet-20241022, gemini-2.0-flash

    # 降级策略
    fallback:
      max_retries: 3        # 选择器失败后重试次数
      enable_agent: true    # 启用 AI Agent 降级
      timeout: 30s          # AI 请求超时

  # Worker 配置
  worker:
    min_workers: 2
    max_workers: 10
    heartbeat_interval: 30s
    task_timeout: 300s

  # 自动扩缩容配置
  scaling:
    enabled: true              # 是否启用自动扩缩容
    check_interval: 30s        # 监控检查间隔
    min_workers: 2             # 最小 Worker 数量
    max_workers: 10            # 最大 Worker 数量
    scale_up_threshold: 0.7    # 扩容阈值（队列/容量比例，0-1）
    scale_down_cooldown: 5m    # 缩容冷却时间
    scale_up_limit: 3          # 单次扩容上限
    enable_mock_docker: true   # 是否使用模拟 Docker 客户端（测试模式）

    # Docker 配置
    docker:
      docker_host: ""         # Docker 主机地址（空值使用 localhost）
      docker_port: 2375       # Docker API 端口
      container_name: "rpa-worker"  # 容器名称前缀
      image_name: "rpa-worker:latest"  # Worker 镜像名称
      network_name: "bridge"  # Docker 网络名称

  # 存储配置
  storage:
    downloads_dir: "./uploads/rpa/downloads"
    screenshots_dir: "./uploads/rpa/screenshots"
    max_retained_days: 7
