# ============================================================================
# XingRan-Next 配置模板（开发/通用）
# ============================================================================
#
# 【使用方式】
#   1) 复制本文件为 config.yaml：
#        cp configs/config.example.yaml configs/config.yaml
#   2) 按需修改（默认已配置为本地开发环境）
#   3) 敏感字段（密码/密钥）留空，通过环境变量注入（见各字段注释）
#
# 【生产环境】
#   生产部署请使用 config.prod.example.yaml 作为基础
#
# 【注意】configs/config.yaml 已在 .gitignore 中排除，**不要**把真实配置提交
# ============================================================================

# 服务器配置
server:
  name: "XingRan-Next-Dev"
  host: "0.0.0.0"
  port: 9000
  mode: "debug"                # debug / release / test

# 数据库配置
# type 决定数据库后端:
#   - postgres(默认/生产): 使用下方 host/port/user/... 键,对齐远端 schema
#   - sqlite(本地 dev 提速): 纯 Go 驱动 glebarez/sqlite,数据文件见 path,
#     首次启动自动建库建表+seed,不访问远端 PG
# dev-only 已知限制(sqlite 模式): reconciliation MV/视图(175/176)与 202-206 迁移 seed
# 不执行;个别含 PG 方言(::uuid/ILIKE/pg_catalog)的端点可能运行期报错。
# 环境变量: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
database:
  type: "postgres"           # postgres | sqlite
  path: "data/xingran.db"    # sqlite 数据文件(仅 type=sqlite 生效)
  host: "localhost"
  port: 5432
  user: "postgres"
  password: ""                 # 留空,通过 DB_PASSWORD 注入
  dbname: "xingran_next"
  sslmode: "disable"
  max_open_conns: 25                              # Phase 62-DBG-01: 10→25 缓解 my-menus 池饥饿
  max_idle_conns: 10                              # 跟随 max_open_conns 等比调整
  max_lifetime: 1800

# 缓存配置 - Redis
# 环境变量: REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
cache:
  type: "redis"                # redis, memory
  host: "localhost"
  port: 6379
  password: ""                 # 留空,通过 REDIS_PASSWORD 注入
  db: 0
  pool_size: 10
  max_size: 1000
  cleanup_time: 600
  warm_up_enabled: false
  l2_writer:
    worker_count: 5
    queue_size: 5000
    enqueue_timeout: 1s
    write_timeout: 5s
    fallback_write_timeout: 3s
  retry_enabled: true
  retry_max_retries: 3
  retry_initial_delay: 50
  retry_max_delay: 2000
  retry_backoff_factor: 2.0
  retry_worker_count: 3

# JWT 配置
# 环境变量: JWT_SECRET, JWT_SM2_PRIVATE_KEY, JWT_SM2_PUBLIC_KEY
jwt:
  secret_key: ""               # 留空,通过 JWT_SECRET 注入（启动时强制校验非空）
  access_key_expire: 7200
  refresh_key_expire: 604800
  issuer: "XingRan-Next-Dev"
  use_sm2: true
  sm2_private_key: ""          # 通过 JWT_SM2_PRIVATE_KEY 注入
  sm2_public_key: ""           # 通过 JWT_SM2_PUBLIC_KEY 注入

# 日志配置
log:
  level: "debug"               # 开发用 debug
  log_dir: "logs"
  max_size: 100
  max_backups: 30
  max_age: 90
  compress: true

# 安全配置
# 环境变量: SM4_KEY
security:
  sm4_key: ""                  # 留空,通过 SM4_KEY 注入
  replay_window_sec: 120       # 开发环境放宽到 120s 便于手动调试
  request_encryption:
    enabled: true
    exclude_paths:
      - "/api/v1/system/auth/public-key"
      - "/api/v1/system/auth/test-sm2"
      - "/api/v1/upload/*"
      - "/api/v1/captcha/*"
      - "/api/v1/rpa/workers/register"
      - "/api/v1/rpa/workers/*/heartbeat"
      - "/api/v1/rpa/workers/progress"
    require_encryption: false
  response_encryption:
    enabled: false
    exclude_paths:
      - "/api/v1/system/auth/public-key"
      - "/api/v1/system/auth/test-sm2"
      - "/api/v1/upload/*"
      - "/api/v1/captcha/*"
      - "/api/v1/rpa/workers/register"
      - "/api/v1/rpa/workers/*/heartbeat"
      - "/api/v1/rpa/workers/progress"

# 操作日志配置
# 开发环境默认关闭排除 — 保留心跳审计以便本地排查 Agent 状态
# 与生产行为一致请改为:
#   exclude_paths:
#     - "/api/v1/rpa/workers/*/heartbeat"
operlog:
  # 排除写入 sys_oper_log 的请求路径(filepath.Match + /* 后缀通配,
  # 与 security.request_encryption.exclude_paths 语义一致)。
  # 高频/无审计价值端点示例: /healthz、/swagger/*、/api/v1/rpa/workers/*/heartbeat
  exclude_paths: []

# 资产对账配置（FIX-12）
# 启动时刷新 reconciliation_normalized 物化视图的超时(秒)。
# 默认 30s(见 internal/config/config.go setDefaults,零配置行为与历史一致);<=0 回退默认。
# 历史:导致刷新超时的 O(N²) 根因已由 migration_180 根治,此项仅保留为防御性可配置能力。
# 环境变量覆盖: XINGRAN_RECONCILIATION_MV_REFRESH_TIMEOUT_SEC
reconciliation:
  mv_refresh_timeout_sec: 30

# 注: AD 域控组同步配置（ad_group_sync）已从本模板移除
# 实际配置通过 sys_config 表或 API 管理,代码不读取配置文件
# 详情: docs/deployment/secret-management.md 第 4 节

# 百度地图配置
# 环境变量: BAIDU_MAP_AK
baidu:
  map_ak: ""                   # 留空,通过 BAIDU_MAP_AK 注入

# RPA 配置
rpa:
  enabled: true
  ai:
    generator:
      enabled: true
      api_key: ""              # 通过 RPA_AI_GENERATOR_KEY 注入
      base_url: ""             # 通过 RPA_AI_GENERATOR_URL 注入
      model: "gpt-4o-mini"
      max_tokens: 4000
    agent:
      enabled: true
      api_key: ""              # 通过 RPA_AI_AGENT_KEY 注入
      base_url: ""             # 通过 RPA_AI_AGENT_URL 注入
      model: "gpt-4o"
      max_tokens: 8000
    fallback:
      max_retries: 3
      enable_agent: true
      timeout: 30s
  worker:
    min_workers: 2
    max_workers: 10
    heartbeat_interval: 30s
    task_timeout: 300s

    # DEBT-03(v1.51): Worker API Token 认证。
    # auth_required: false = 宽限期双读(默认,老 Worker 无 Token 仍可通信);
    #                true  = 无/错/过期 Token 一律 401。
    # provisioning_tokens 生产环境经 env 注入,勿提交明文。
    auth:
      auth_required: false
      provisioning_tokens: []   # 示例: ["rpa-prod-main-2026"]
      token_expire_days: 90
  scaling:
    enabled: true
    check_interval: 30s
    min_workers: 2
    max_workers: 10
    scale_up_threshold: 0.7
    scale_down_cooldown: 5m
    scale_up_limit: 3
    enable_mock_docker: true   # 开发环境用 mock
    docker:
      docker_host: ""
      docker_port: 2375
      container_name: "rpa-worker"
      image_name: "rpa-worker:latest"
      network_name: "bridge"
  storage:
    downloads_dir: "./uploads/rpa/downloads"
    screenshots_dir: "./uploads/rpa/screenshots"
    max_retained_days: 7

# VDI 客户端 TLS 证书校验开关
# 开发环境通常用自签名证书,保持 true
vdi:
  tls_skip_verify: true

# AD/LDAP 客户端 TLS 证书校验开关
# 开发环境通常用自签名证书,保持 true
ad:
  tls_skip_verify: true
